services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockpile
      POSTGRES_USER: stockpile
      POSTGRES_PASSWORD: stockpile
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stockpile-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpile -d stockpile"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  stockpile-postgres:
